name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compute version
        run: echo "VC=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -Pvc=$VC -Pvn=1.0.$VC

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/*.apk PrismVLC.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismVLC-apk
          path: PrismVLC.apk

      - name: Publish release (the app picks this up)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VC }}
          name: Prism build ${{ env.VC }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: PrismVLC.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
